<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karta Udzielenia Kwalifikowanej Pierwszej Pomocy - PSP</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1f082e 0%, #3a0ca3 50%, #121212 100%);
            --accent-color: #7209b7;
            --accent-hover: #560bad;
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --text-color: #f8f9fa;
            --text-muted: #adb5bd;
            --border-color: #2e2e3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .main-header {
            background: var(--primary-gradient);
            color: #ffffff;
            text-align: center;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
            border: 1px solid rgba(114, 9, 183, 0.3);
        }

        .main-header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .section-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
        }

        .section-card h2 {
            margin-top: 0;
            font-size: 17px;
            color: #c77dff;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: #121218;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(114, 9, 183, 0.2);
        }

        .date-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-today {
            background-color: #2b1046;
            color: #e0aaff;
            border: 1px solid var(--accent-color);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-today:hover {
            background-color: #3c1563;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: #121218;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .checkbox-item input, .radio-group input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
            font-size: 13px;
        }

        .submit-container {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .btn-submit {
            background: var(--primary-gradient);
            color: white;
            border: 1px solid rgba(199, 125, 255, 0.4);
            padding: 14px 35px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(114, 9, 183, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(114, 9, 183, 0.6);
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header">
        <h1>Karta Udzielenia Kwalifikowanej Pierwszej Pomocy</h1>
    </div>

    <form id="kppForm">
        
        <!-- ZDARZENIE -->
        <div class="section-card">
            <h2>Zdarzenie</h2>
            <div class="grid-3">
                <div class="form-group">
                    <label>Data zdarzenia</label>
                    <div class="date-input-wrapper">
                        <input type="date" id="dataZdarzenia">
                        <button type="button" class="btn-today" onclick="setToday('dataZdarzenia')">Dzisiaj</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Miejsce zdarzenia</label>
                    <input type="text" id="miejsceZdarzenia" placeholder="Wpisz miejsce zdarzenia">
                </div>
                <div class="form-group">
                    <label>Imię i nazwisko ratownika</label>
                    <input type="text" id="ratownik" placeholder="Imię i nazwisko ratownika">
                </div>
            </div>
        </div>

        <!-- POSZKODOWANY -->
        <div class="section-card">
            <h2>Poszkodowany</h2>
            <div class="grid-2">
                <div class="form-group">
                    <label>Płeć</label>
                    <div class="radio-group" style="padding-top: 8px;">
                        <label class="radio-label"><input type="radio" name="plec" value="Mężczyzna"> Mężczyzna</label>
                        <label class="radio-label"><input type="radio" name="plec" value="Kobieta"> Kobieta</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Data urodzenia (Dzień, Miesiąc, Rok)</label>
                    <div class="date-input-wrapper">
                        <input type="date" id="dataUrodzenia">
                        <button type="button" class="btn-today" onclick="setToday('dataUrodzenia')">Dzisiaj</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Imię</label>
                    <input type="text" id="imie" placeholder="Imię poszkodowanego">
                </div>
                <div class="form-group">
                    <label>Nazwisko</label>
                    <input type="text" id="nazwisko" placeholder="Nazwisko poszkodowanego">
                </div>
                <div class="form-group full-width">
                    <label>Uwagi</label>
                    <textarea id="uwagi" rows="2" placeholder="Dodatkowe uwagi..."></textarea>
                </div>
            </div>
        </div>

        <!-- OCENA AVPU -->
        <div class="section-card">
            <h2>Ocena AVPU</h2>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="avpu" value="A - Alert"> <strong>A</strong> - Alert</label>
                <label class="radio-label"><input type="radio" name="avpu" value="P - Pain"> <strong>P</strong> - Pain</label>
                <label class="radio-label"><input type="radio" name="avpu" value="V - Verbal"> <strong>V</strong> - Verbal</label>
                <label class="radio-label"><input type="radio" name="avpu" value="U - Unresponsive"> <strong>U</strong> - Unresponsive</label>
            </div>
        </div>

        <!-- PARAMETRY -->
        <div class="section-card">
            <h2>Parametry</h2>
            <div class="grid-3">
                <div class="form-group">
                    <label>SpO2 (%)</label>
                    <input type="text" id="spo2" placeholder="np. 98%">
                </div>
                <div class="form-group">
                    <label>Tętno (/min)</label>
                    <input type="text" id="tetno" placeholder="np. 80">
                </div>
                <div class="form-group">
                    <label>Oddechy (/min)</label>
                    <input type="text" id="oddechy" placeholder="np. 16">
                </div>
            </div>
        </div>

        <!-- WYWIAD SAMPLE -->
        <div class="section-card">
            <h2>Wywiad SAMPLE</h2>
            <div class="grid-2">
                <div class="form-group">
                    <label>S - Objawy / symptomy</label>
                    <input type="text" id="sampleS" placeholder="Objawy">
                </div>
                <div class="form-group">
                    <label>A - Alergie</label>
                    <input type="text" id="sampleA" placeholder="Alergie">
                </div>
                <div class="form-group">
                    <label>M - Leki</label>
                    <input type="text" id="sampleM" placeholder="Leki">
                </div>
                <div class="form-group">
                    <label>P - Przebyte choroby</label>
                    <input type="text" id="sampleP" placeholder="Przebyte choroby">
                </div>
                <div class="form-group">
                    <label>L - Posiłek</label>
                    <input type="text" id="sampleL" placeholder="Ostatni posiłek">
                </div>
                <div class="form-group">
                    <label>E - Opis zdarzenia</label>
                    <input type="text" id="sampleE" placeholder="Opis zdarzenia">
                </div>
            </div>
        </div>

        <!-- OCENA ABC -->
        <div class="section-card">
            <h2>Ocena ABC</h2>
            <div class="form-group">
                <label>A - Drożność dróg oddechowych</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="abc_a" value="Drożne"> Drożne</label>
                    <label class="checkbox-item"><input type="checkbox" name="abc_a" value="Udrożnione"> Udrożnione</label>
                    <label class="checkbox-item"><input type="checkbox" name="abc_a" value="Udrożnione rurka UG"> Udrożnione rurka UG</label>
                    <label class="checkbox-item"><input type="checkbox" name="abc_a" value="Przyrząd nagłośniowy"> Przyrząd nagłośniowy</label>
                </div>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>B - Oddech</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="abc_b" value="Obecny"> Obecny</label>
                    <label class="checkbox-item"><input type="checkbox" name="abc_b" value="Brak prawidłowego oddechu"> Brak prawidłowego oddechu</label>
                    <label class="checkbox-item"><input type="checkbox" name="abc_b" value="Terapia bierna"> Terapia bierna</label>
                    <label class="checkbox-item"><input type="checkbox" name="abc_b" value="Czynna respirator"> Czynna / respirator</label>
                </div>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>C - Krążenie</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="abc_c" value="Obecne"> Obecne</label>
                    <label class="checkbox-item"><input type="checkbox" name="abc_c" value="Brak centralizacja"> Brak / centralizacja</label>
                </div>
            </div>
        </div>

        <!-- RODZAJ OBJAWÓW -->
        <div class="section-card">
            <h2>Rodzaj objawów</h2>
            <div class="checkbox-grid" id="objawyGrid">
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Odmrożenie"> Odmrożenie</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Podtopienie"> Podtopienie</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Obrażenia głowy"> Obrażenia głowy</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Podejrzenie miednicy"> Podejrzenie miednicy</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Podejrzenie klatki piersiowej"> Podejrzenie klatki piersiowej</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Zwichnięcie / skręcenie"> Zwichnięcie / skręcenie</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Amputacja"> Amputacja</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Skażenie"> Skażenie</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Zatrucie wziewne"> Zatrucie wziewne</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Podejrzenie kręgosłupa"> Podejrzenie kręgosłupa</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Podejrzenie jamy brzusznej"> Podejrzenie jamy brzusznej</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Złamanie kończyny"> Złamanie kończyny</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Rana"> Rana</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Krwotok"> Krwotok</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Zmiażdżenie"> Zmiażdżenie</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Drgawki"> Drgawki</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Zaburzenia zachowania"> Zaburzenia zachowania</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Anafilaksja"> Anafilaksja</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Wstrząs"> Wstrząs</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Omdlenie"> Omdlenie</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Zatrzymanie krążenia"> Zatrzymanie krążenia</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Duszności"> Duszności</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Wymioty"> Wymioty</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Ból w klatce piersiowej"> Ból w klatce piersiowej</label>
                <label class="checkbox-item"><input type="checkbox" name="objawy" value="Ciąża"> Ciąża</label>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label>Inne objawy do wpisania</label>
                <input type="text" id="inneObjawy" placeholder="Wpisz inne objawy...">
            </div>
        </div>

        <!-- POSTĘPOWANIE -->
        <div class="section-card">
            <h2>Postępowanie</h2>
            <div class="checkbox-grid" id="postepowanieGrid">
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Wsparcie psychiczne"> Wsparcie psychiczne</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Pozycja bezpieczna"> Pozycja bezpieczna</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Usunięcie ciała obcego"> Usunięcie ciała obcego</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Użycie AED"> Użycie AED</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Unieruchomienie złamania / zwichnięcia"> Unieruchomienie złamania / zwichnięcia</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Kołnierz"> Kołnierz ortopedyczny</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Opatrunek wentylacyjny / hemostatyczny"> Opatrunek wentylacyjny / hemostatyczny</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Opatrunek osłonowy"> Opatrunek osłonowy</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Chusta taktyczna"> Chusta taktyczna</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Termoizolacja"> Termoizolacja</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Uciskanie klatki piersiowej"> Uciskanie klatki piersiowej</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Ograniczenie ruchu kręgosłupa"> Ograniczenie ruchu kręgosłupa</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Noszenie na desce"> Noszenie na desce</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Pas do stabilizacji"> Pas do stabilizacji</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Zabezpieczenie amputowanej tkanki"> Zabezpieczenie amputowanej tkanki</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Opatrunek uciskowy"> Opatrunek uciskowy</label>
                <label class="checkbox-item"><input type="checkbox" name="postepowanie" value="Monitorowanie poszkodowanego"> Monitorowanie poszkodowanego</label>
            </div>
        </div>

        <!-- PRZYCISK WYSŁANIA -->
        <div class="submit-container">
            <button type="button" class="btn-submit" onclick="wyslijNaWebhook()">Wyślij kartę zdarzenia</button>
        </div>

    </form>
</div>

st postepowanie = getSelectedCheckboxes('postepowanie');  // Tworzenie Discord Embed const embed = { title: "🚨 Karta Udzielenia Kwalifikowanej Pierwszej Pomocy (PSP)", color: 7474111, // Kolor fioletowy (decyzyjny) fields: [ { name: "📍 Zdarzenie", value: `**Data:** ${dataZdarzenia}\n**Miejsce:** ${miejsce}\n**Ratownik:** ${ratownik}`, inline: false },
